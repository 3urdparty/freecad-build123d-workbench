name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uvx ruff check .

  # Fast tests: RPC protocol + executor. No OCP, no FreeCAD.
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest tests/test_rpc_protocol.py tests/test_executor.py -v

  # Kernel tests against the real CAD stack (OCP + build123d + cadquery).
  kernel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Keep these pins in sync with preferences.package_pins() — CI should
      # test the exact versions the workbench provisions for users.
      - run: pip install pytest build123d==0.11.1 cadquery==2.8.0 -e ./kernel
      - run: pytest tests/ -v

  # Full end-to-end, headless inside real FreeCAD: script -> kernel (venv
  # provisioned for real) -> BREP -> parametric object -> recompute paths.
  freecad-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The kernel's OCP wheels link libGL, which the headless runner images
      # do not ship. Without it every geometry script dies at `import
      # build123d` and each check fails for a reason that looks nothing like
      # a missing system library.
      - run: sudo apt-get update && sudo apt-get install -y libgl1
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: fc
          create-args: >-
            -c conda-forge
            freecad=1.0
            python=3.11
      - run: micromamba run -n fc env FC_CODE_PROVISIONING_CONSENT=1 bash tests/freecad/run_e2e.sh
        timeout-minutes: 20
      # An abnormal exit is most likely resource pressure: the kernel env
      # pulls both cadquery-ocp variants plus vtk. Say so out loud instead of
      # leaving the next reader to guess.
      - if: failure()
        run: |
          df -h /
          free -m
          sudo dmesg 2>/dev/null | tail -30 || true
