[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fc-code-kernel"
version = "0.2.0"
description = "Execution kernel for the FreeCAD Code Workbench: runs build123d/CadQuery scripts and serializes results as BREP."
requires-python = ">=3.10"
license = "LGPL-2.1-or-later"
dependencies = [
    "jedi>=0.19",  # code intelligence for the embedded editor (kernel.complete)
]
# build123d / cadquery / OCP are installed alongside by the workbench's
# KernelManager (user-configurable pins), not declared here, so the kernel
# package itself stays installable in minimal test environments.

[project.optional-dependencies]
cad = ["build123d", "cadquery"]

[tool.hatch.build.targets.wheel]
packages = ["fc_code_kernel"]
